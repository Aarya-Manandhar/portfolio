<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Cream background with rounded corners -->
  <rect width="100" height="100" rx="20" ry="20" fill="#F5F0E8"/>
  <!-- Bold "A" -->
  <text x="10" y="72" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="62" fill="#1a1a1a" letter-spacing="-2">A</text>
  <!-- Bold "M" -->
  <text x="48" y="72" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="62" fill="#1a1a1a" letter-spacing="-2">M</text>
  <!-- Red diagonal slash accent -->
  <line x1="8" y1="68" x2="92" y2="38" stroke="#E8272A" stroke-width="6" stroke-linecap="round"/>
</svg>